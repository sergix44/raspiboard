name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOLING_IMAGE: localhost/raspiboard-packaging:debian13

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Cache Cargo downloads and compiled dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/packaging/cache/cargo/registry
            target/packaging/cache/target
          key: linux-packages-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/Containerfile', 'packaging/linux/tools.json', 'packaging/linux/install-tools.php') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-packages-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/Containerfile', 'packaging/linux/tools.json', 'packaging/linux/install-tools.php') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-
            linux-packages-build-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/Containerfile', 'packaging/linux/tools.json', 'packaging/linux/install-tools.php') }}-

      - name: Prepare tooling image
        uses: ./.github/actions/packaging-tooling
        with:
          save-cache: 'true'

      - name: Compile application and test executables
        run: ./scripts/package-linux --engine docker --stage build --jobs "$(nproc)" --image "$TOOLING_IMAGE" --plain

      - name: Archive shared build and test compiler outputs
        run: |
          mkdir -p target/transfer
          tar --format=posix -I 'zstd -T0' -cf target/transfer/linux-build.tar.zst \
            target/packaging/staged target/packaging/cache/cargo/registry
          tar --format=posix -I 'zstd -T0' -cf target/transfer/linux-test-cache.tar.zst \
            target/packaging/cache/target

      - name: Upload prepared build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/transfer/linux-build.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload test compiler outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/transfer/linux-test-cache.tar.zst
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Show failed build log
        if: failure()
        run: tail -n 120 target/packaging/staged/build.log target/packaging/runs/*/build.log 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-build-logs-${{ github.sha }}
          path: |
            target/packaging/staged/build.log
            target/packaging/runs/*/build.log
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: app-unit-tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare tooling image
        uses: ./.github/actions/packaging-tooling

      - name: Download prepared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-build.tar.zst
          skip-decompress: true
          path: target/transfer

      - name: Restore prepared sources and package assets
        run: tar --zstd -xf target/transfer/linux-build.tar.zst

      - name: Download test compiler outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-test-cache.tar.zst
          skip-decompress: true
          path: target/transfer

      - name: Restore test compiler outputs
        run: tar --zstd -xf target/transfer/linux-test-cache.tar.zst

      - name: Run application and packaging support tests
        run: ./scripts/package-linux --engine docker --stage test --jobs "$(nproc)" --image "$TOOLING_IMAGE" --plain

      - name: Show failed test log
        if: failure()
        run: tail -n 120 target/packaging/staged/build.log target/packaging/runs/*/build.log 2>/dev/null || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-test-logs-${{ github.sha }}
          path: |
            target/packaging/staged/build.log
            target/packaging/runs/*/build.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: packaging
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Prepare tooling image
        uses: ./.github/actions/packaging-tooling

      - name: Download prepared build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-build.tar.zst
          skip-decompress: true
          path: target/transfer

      - name: Restore prepared sources and package assets
        run: tar --zstd -xf target/transfer/linux-build.tar.zst

      - name: Package and validate the prepared executable
        run: ./scripts/package-linux --engine docker --stage package --jobs "$(nproc)" --image "$TOOLING_IMAGE" --plain

      - name: Verify download checksums
        working-directory: target/packages
        run: sha256sum --check SHA256SUMS

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/packages/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/packages/*.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/packages/SHA256SUMS
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Show failed package log
        if: failure()
        run: tail -n 120 target/packaging/staged/build.log target/packaging/runs/*/build.log 2>/dev/null || true

      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-package-logs-${{ github.sha }}
          path: |
            target/packaging/staged/build.log
            target/packaging/runs/*/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: update-draft-release
    needs: package
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download Debian package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: raspiboard_*.deb
          merge-multiple: true
          skip-decompress: true
          path: target/packages

      - name: Download AppImage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Raspiboard-*.AppImage
          merge-multiple: true
          skip-decompress: true
          path: target/packages

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SHA256SUMS
          merge-multiple: true
          skip-decompress: true
          path: target/packages

      - name: Verify release checksums
        working-directory: target/packages
        run: sha256sum --check SHA256SUMS

      - name: Update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          draft=$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")

          case "$draft" in
            false)
              echo "::notice::Release $tag is already published. Bump Cargo.toml to prepare the next draft."
              exit 0
              ;;
            true|'') ;;
            *)
              echo "::error::Multiple releases match $tag; resolve them before updating packages."
              exit 1
              ;;
          esac

          existing_tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
          if [ -n "$existing_tag" ]; then
            echo "::error::Tag $tag already exists. Use an untagged version so publishing targets the built commit."
            exit 1
          fi

          if [ "$draft" = true ]; then
            gh release upload "$tag" target/packages/*.deb target/packages/*.AppImage \
              target/packages/SHA256SUMS --clobber
            gh release edit "$tag" --target "$GITHUB_SHA"
          else
            gh release create "$tag" target/packages/*.deb target/packages/*.AppImage \
              target/packages/SHA256SUMS --draft --target "$GITHUB_SHA" \
              --title "Raspiboard $tag" \
              --notes "Linux x86-64 packages for Debian 13+ and Ubuntu 26.04+. Download the .deb or AppImage and SHA256SUMS to verify your download."
          fi
