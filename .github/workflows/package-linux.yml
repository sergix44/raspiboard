name: Build Linux packages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: AppImage and Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check build prerequisites
        run: |
          php --version
          docker version

      - name: Cache Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target/packaging/cache/cargo/registry
          key: linux-packages-cargo-v1-${{ hashFiles('Cargo.lock', 'packaging/linux/Containerfile') }}
          restore-keys: linux-packages-cargo-v1-

      - name: Build and validate packages
        run: ./scripts/package-linux --engine docker --plain

      - name: Verify download checksums
        working-directory: target/packages
        run: sha256sum --check SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: raspiboard-linux-x86_64-${{ github.sha }}
          path: |
            target/packages/*.AppImage
            target/packages/*.deb
            target/packages/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Show failed build log
        if: failure()
        run: |
          php <<'PHP'
          <?php
          foreach (glob('target/packaging/runs/*/build.log') as $log) {
              echo "\n", $log, "\n";
              echo implode('', array_slice(file($log), -120));
          }
          PHP

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packaging-logs-${{ github.sha }}
          path: target/packaging/runs/*/build.log
          if-no-files-found: ignore
          retention-days: 7
