name: ci

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: build-test-package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TOOLING_IMAGE: localhost/raspiboard-packaging:debian13

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check build prerequisites
        run: |
          php --version
          docker version

      - name: Cache Cargo downloads and compiled dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            target/packaging/cache/cargo/registry
            target/packaging/cache/target
          key: linux-packages-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/Containerfile', 'packaging/linux/tools.json', 'packaging/linux/install-tools.php') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            linux-packages-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/Containerfile', 'packaging/linux/tools.json', 'packaging/linux/install-tools.php') }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}-
            linux-packages-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/linux/Containerfile', 'packaging/linux/tools.json', 'packaging/linux/install-tools.php') }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and cache tooling image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: packaging/linux
          file: packaging/linux/Containerfile
          tags: ${{ env.TOOLING_IMAGE }}
          load: true
          cache-from: type=gha,scope=linux-packaging-tooling
          cache-to: type=gha,scope=linux-packaging-tooling,mode=max

      - name: Build, test, and validate both packages
        run: ./scripts/package-linux --engine docker --format all --image "$TOOLING_IMAGE" --plain

      - name: Verify download checksums
        working-directory: target/packages
        run: sha256sum --check SHA256SUMS

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/packages/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/packages/*.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: target/packages/SHA256SUMS
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Show failed build log
        if: failure()
        run: |
          php <<'PHP'
          <?php
          foreach (glob('target/packaging/runs/*/build.log') as $log) {
              echo "\n", $log, "\n";
              echo implode('', array_slice(file($log), -120));
          }
          PHP

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packaging-logs-${{ github.sha }}
          path: target/packaging/runs/*/build.log
          if-no-files-found: ignore
          retention-days: 7
