name: website

on:
  push:
    branches: [master]
    paths:
      - website/**
      - img/icon_full.png
      - assets/fonts/MonaspaceKrypton-Regular-1.400.otf
      - assets/fonts/monaspace-LICENSE
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish-website
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: node --check website/script.js

      - name: Prepare static website
        run: |
          mkdir -p target/website/raspiboard/assets
          cp website/index.html website/guide.html website/styles.css website/script.js target/website/raspiboard/
          cp img/icon_full.png target/website/raspiboard/assets/
          cp assets/fonts/MonaspaceKrypton-Regular-1.400.otf assets/fonts/monaspace-LICENSE target/website/raspiboard/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: target/website/raspiboard

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
